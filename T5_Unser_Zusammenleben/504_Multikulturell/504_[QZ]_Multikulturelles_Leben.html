<style>
:root{
  --t1:#E67F22; --t1-dark:#CA6F1E; --t1-light:#FDEBD0;
  --ink:#1E2530; --ink-soft:#4A5568; --line:#E3E7ED; --bg:#F7F8FA;
  --ok:#2E7D32; --ok-bg:#E8F5E9; --err:#C62828; --err-bg:#FDECEA;
  --gold:#B8860B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.qz-nav{background:#f7f7f7;border-bottom:1px solid #ccc;font-family:sans-serif;font-size:12px;color:#444;width:100%;border-collapse:collapse}
.qz-nav td{padding:6px 10px}
.qz-nav a{color:var(--t1-dark);text-decoration:none}
.topbar{background:var(--t1);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .tag{font-family:'JetBrains Mono',monospace;font-size:.78rem;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:6px}
.topbar h1{font-size:1.05rem;font-weight:700}
.topbar a.nav{margin-left:auto;color:#fff;font-size:.85rem;text-decoration:none;opacity:.9}
.wrap{max-width:680px;margin:0 auto;padding:26px 18px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 2px 10px rgba(30,37,48,.05)}
.hud{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.hud .box{flex:1;min-width:110px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center}
.hud .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft)}
.hud .val{font-family:'JetBrains Mono',monospace;font-size:1.25rem;font-weight:700}
.hud .val.streak-hot{color:var(--t1)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
.progress i{display:block;height:100%;background:var(--t1);width:0;transition:width .35s}
.level-badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:99px;margin-bottom:12px;letter-spacing:.06em}
.lv1{background:#E8F0E9;color:var(--ok)} .lv2{background:#FFF4E0;color:var(--gold)} .lv3{background:var(--t1-light);color:var(--t1)}
.qtext{font-size:1.18rem;font-weight:700;margin-bottom:20px;line-height:1.5}
.opts button{display:block;width:100%;text-align:left;padding:14px 16px;margin:9px 0;background:#FCFCFD;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:1rem;cursor:pointer;transition:.15s}
.opts button:hover:not(:disabled){border-color:var(--t1);transform:translateX(3px)}
.opts button:disabled{cursor:default;opacity:.85}
.opts button.right{background:var(--ok-bg);border-color:var(--ok);font-weight:700}
.opts button.wrong{background:var(--err-bg);border-color:var(--err)}
.opts button.gone{opacity:.25}
.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:.94rem;display:none}
.fb.show{display:block}
.fb.good{background:var(--ok-bg);color:var(--ok)} .fb.bad{background:var(--err-bg);color:var(--err)}
.actions{display:flex;gap:10px;margin-top:20px}
button.btn{font:inherit;font-weight:700;padding:12px 22px;border-radius:10px;border:none;cursor:pointer}
.btn-main{background:var(--t1);color:#fff}
.btn-main:hover{background:var(--t1-dark)}
.btn-joker{background:#fff;border:2px solid var(--gold);color:var(--gold)}
.btn-joker:disabled{opacity:.35;cursor:default}
.center{text-align:center}
.big{font-size:2rem;font-weight:800;margin:10px 0}
.rank{font-size:3rem;margin:6px 0}
.subtitle{color:var(--ink-soft);margin-bottom:22px}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.bonus-tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.75rem;background:#FFF4E0;color:var(--gold);padding:2px 10px;border-radius:99px;margin-left:8px}
.extras{margin-top:22px}
.extras h2{font-size:.95rem;font-weight:800;color:var(--ink);margin-bottom:6px}
.extras-hint{font-size:.8rem;color:var(--ink-soft);margin-bottom:12px}
.extras-hint a{color:var(--t1)}
.extras-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit;transition:.15s}
.extras-item:hover{border-color:var(--t1);transform:translateX(3px)}
.extras-tag{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;background:var(--t1-light);color:var(--t1);padding:3px 8px;border-radius:6px;white-space:nowrap}
.extras-body{flex:1;font-size:.88rem;color:var(--ink-soft);line-height:1.4}
.extras-body b{color:var(--ink);font-size:.94rem}
.extras-arrow{color:var(--ink-soft);font-size:1.1rem}
@media print{.qz-nav{display:none}}
</style>
</head>
<body>
<table class="qz-nav" width="100%">
<tr>
<td style="text-align:left;width:33%"><a href="504_[TH]_Multikulturelles_Leben.html">&#8592; Theorie</a></td>
<td style="text-align:center;width:34%"><a href="../../detail.html#504">&#8593; Übersicht 504</a></td>
<td style="text-align:right;width:33%"><a href="504_[TE]_Multikulturelles_Leben.html">Test &#8594;</a></td>
</tr>
</table>
<div class="topbar">
  <span class="tag">504 · [QZ]</span>
  <h1>Vielfalts-Check</h1>
  <a class="nav" href="504_Aufgaben.html">→ Zu den Übungen</a>
</div>
<div class="wrap">

  <div class="hud" id="hud" style="display:none">
    <div class="box"><div class="lbl">Frage</div><div class="val" id="hQ">–</div></div>
    <div class="box"><div class="lbl">Punkte</div><div class="val" id="hP">0</div></div>
    <div class="box"><div class="lbl">Serie</div><div class="val" id="hS">0</div></div>
  </div>
  <div class="progress" id="prog" style="display:none"><i id="progFill"></i></div>

  <div class="card" id="stage">
    <div class="center">
      <div class="rank">🌍</div>
      <div class="big">Vielfalts-Check</div>
      <p class="subtitle">12 Fragen · 3 Levels · Streak-Bonus ab 3 richtigen in Serie · 1 Joker (50:50).<br>Von gesellschaftlicher Vielfalt bis Antirassismusstrafnorm – wie sattelfest bist du?</p>
      <button class="btn btn-main" onclick="start()">Quiz starten</button>
    </div>
  </div>

</div>
<script>
const QUESTIONS=[
 // Level 1
 {lv:1,q:"Seit wann erleichtert ein Abkommen mit der EU/EFTA die Zuwanderung von Arbeitskräften aus Europa deutlich?",o:["Seit den 1950er-Jahren","Seit der Personenfreizügigkeit im Jahr 2002","Erst seit 2020"],a:1,fb:"Die Personenfreizügigkeit mit der EU/EFTA gilt seit 2002 und erleichtert Zuwanderung aus Europa für Arbeit und Ausbildung."},
 {lv:1,q:"Ein Lehrbetrieb lehnt eine Bewerbung ab, nachdem er den ausländisch klingenden Namen der Bewerberin gesehen hat, obwohl die Qualifikation passt. Was ist das?",o:["Ein normaler, rechtlich unbedenklicher Entscheid","Ein möglicher Fall von Diskriminierung aufgrund der Herkunft","Rechtlich ohne Bedeutung, da Privatpersonen frei entscheiden dürfen"],a:1,fb:"Eine Ablehnung aufgrund des Namens statt der Qualifikation ist ein typisches Beispiel für Diskriminierung bei der Stellensuche."},
 {lv:1,q:"Welche der folgenden Voraussetzungen gehört gemäss Art. 36 BV NICHT zu den vier Bedingungen für eine zulässige Einschränkung von Grundrechten?",o:["Gesetzliche Grundlage","Verhältnismässigkeit","Zustimmung der betroffenen Person"],a:2,fb:"Die vier Voraussetzungen sind gesetzliche Grundlage, öffentliches Interesse, Verhältnismässigkeit und unantastbarer Kerngehalt – eine Zustimmung der betroffenen Person ist nicht erforderlich."},
 {lv:1,q:"Welches Merkmal wurde 2020 durch eine Volksabstimmung neu in die Antirassismusstrafnorm (Art. 261bis StGB) aufgenommen?",o:["Religion","Ethnie","Sexuelle Orientierung"],a:2,fb:"Seit der Volksabstimmung vom 9. Februar 2020 (in Kraft seit 1. Juli 2020) schützt die Norm auch vor Diskriminierung aufgrund der sexuellen Orientierung."},
 // Level 2
 {lv:2,q:"Eine Firma verlangt für eine Stelle akzentfreies Hochdeutsch, obwohl das für die Tätigkeit fachlich nicht notwendig ist. Welche Form von Diskriminierung liegt hier möglicherweise vor?",o:["Direkte Diskriminierung, weil offen nach der Herkunft gefragt wird","Indirekte Diskriminierung durch eine formal neutrale Anforderung, die bestimmte Gruppen faktisch benachteiligt","Keine Diskriminierung, da Sprachanforderungen immer zulässig sind"],a:1,fb:"Indirekte Diskriminierung entsteht durch neutral wirkende Regeln oder Praktiken, die bestimmte Gruppen faktisch benachteiligen."},
 {lv:2,q:"Eine Gemeinde verbietet aus Sicherheitsgründen sämtliche Versammlungen im öffentlichen Raum für ein ganzes Jahr, obwohl mildere Massnahmen (z.B. eine Bewilligungspflicht) ausreichen würden. Welche Voraussetzung von Art. 36 BV ist hier verletzt?",o:["Die gesetzliche Grundlage","Die Verhältnismässigkeit","Der Kerngehalt bleibt unantastbar"],a:1,fb:"Die Massnahme ist nicht erforderlich, weil mildere Mittel ausreichen würden – das verletzt die Verhältnismässigkeit."},
 {lv:2,q:"Zwei Freunde äussern sich im privaten Gespräch abwertend über eine Bevölkerungsgruppe, niemand sonst hört zu. Greift hier die Antirassismusstrafnorm (Art. 261bis StGB)?",o:["Ja, jede diskriminierende Äusserung ist strafbar","Grundsätzlich nein – die Norm schützt vor öffentlicher Hetze, private Äusserungen im engen Kreis fallen meist nicht darunter","Ja, aber nur wenn die Äusserung schriftlich erfolgt"],a:1,fb:"Die Antirassismusstrafnorm schützt vor öffentlicher Diskriminierung – rein private Äusserungen im engen persönlichen Kreis fallen grundsätzlich nicht darunter."},
 {lv:2,q:"Welche der folgenden Aussagen zu den Ursachen gesellschaftlicher Vielfalt der Schweiz trifft laut Theorie zu?",o:["Ausschliesslich die vier Landessprachen erklären die Vielfalt","Arbeitsmigration, Personenfreizügigkeit, Flucht/Asyl und Binnenmobilität tragen gemeinsam dazu bei","Ein einmaliger Volksentscheid aus dem Jahr 2002 ist die einzige Ursache"],a:1,fb:"Arbeitsmigration, Personenfreizügigkeit, Flucht/Asyl und Binnenmobilität sind zusammen die genannten Ursachen der gesellschaftlichen Vielfalt."},
 // Level 3
 {lv:3,q:"Der Bund erlässt ein Gesetz, das eine bestimmte Kleidung im öffentlichen Raum verbietet. Die Massnahme hat eine gesetzliche Grundlage, verfolgt ein öffentliches Interesse und ist verhältnismässig – greift aber so weit, dass der Kerngehalt der persönlichen Freiheit für die betroffene Gruppe praktisch aufgehoben wird. Ist die Einschränkung zulässig?",o:["Ja, weil drei von vier Voraussetzungen erfüllt sind","Nein, weil der Kerngehalt eines Grundrechts nie vollständig ausgehöhlt werden darf","Ja, weil eine gesetzliche Grundlage immer ausreicht"],a:1,fb:"Alle vier Voraussetzungen von Art. 36 BV müssen gleichzeitig erfüllt sein – fehlt auch nur eine, ist die Einschränkung unzulässig."},
 {lv:3,q:"Eine Person postet öffentlich auf Social Media wiederholt Inhalte, die eine Ideologie propagieren, welche eine Religionsgemeinschaft systematisch herabsetzt. Nach welcher Norm könnte sich diese Person strafbar machen?",o:["Art. 36 BV, weil ein Grundrecht eingeschränkt wird","Art. 261bis StGB (Antirassismusstrafnorm), da öffentlich zur Herabsetzung aufgrund der Religion beigetragen wird","Keine, da Social-Media-Posts rechtlich nicht erfasst sind"],a:1,fb:"Öffentliche Propagierung einer Ideologie, die eine geschützte Gruppe (hier: Religion) systematisch herabsetzt, fällt unter Art. 261bis StGB."},
 {lv:3,q:"Ende 2025 liegt der Anteil der ständigen ausländischen Wohnbevölkerung an der Gesamtbevölkerung der Schweiz bei rund 26%. Wie ordnet die Theorie diese Zahl ein?",o:["Als vorübergehenden Ausnahmezustand der letzten Monate","Als Beleg dafür, dass gesellschaftliche Vielfalt seit Jahrzehnten Alltag in der Schweiz ist","Als Folge einer einzigen Gesetzesänderung im Jahr 2025"],a:1,fb:"Gesellschaftliche Vielfalt ist kein Sonderfall, sondern seit Jahrzehnten Alltag in der Schweiz."},
 {lv:3,q:"Eine Person wird bei der Wohnungssuche mehrfach abgelehnt, sobald die Vermietenden ihre Herkunft erkennen. Was empfiehlt die Theorie als sinnvollen nächsten Schritt?",o:["Die Situation stillschweigend hinnehmen, da nichts unternommen werden kann","Den Vorfall dokumentieren und sich an eine Beratungs- bzw. Fachstelle für Rassismusbekämpfung/Integration wenden","Sich nur noch bei Bekannten bewerben, um das Problem zu umgehen"],a:1,fb:"Bei Diskriminierung empfiehlt die Theorie, den Vorfall zu dokumentieren und sich an eine entsprechende Fachstelle zu wenden."}
];
const RANKS=[
 {min:0,icon:"🌱",name:"Vielfalts-Neuling",txt:"Solider Start – wirf nochmal einen Blick auf die Theorie und starte erneut!"},
 {min:60,icon:"🤝",name:"Vielfalts-Kennerin",txt:"Stark! Diskriminierung, Grundrechte und Antirassismusstrafnorm sitzen schon gut."},
 {min:85,icon:"🌍",name:"Vielfalts-Profi",txt:"Top! Du kennst die rechtlichen und gesellschaftlichen Grundlagen des Zusammenlebens in einer vielfältigen Schweiz."}
];
const BASE=10, STREAK_AT=3, SPEED_MS=8000, SPEED_PTS=5;
let order=[],i=0,pts=0,streak=0,best=0,joker=1,tStart=0,correctCount=0,locked=false;
const $=id=>document.getElementById(id);

function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}

function start(){
  order=[...shuffle(QUESTIONS.filter(q=>q.lv==1)),...shuffle(QUESTIONS.filter(q=>q.lv==2)),...shuffle(QUESTIONS.filter(q=>q.lv==3))];
  i=0;pts=0;streak=0;best=0;joker=1;correctCount=0;
  $('hud').style.display='flex';$('prog').style.display='block';
  render();
}

function render(){
  locked=false;
  const q=order[i];
  $('hQ').textContent=(i+1)+'/'+order.length;
  $('hP').textContent=pts;
  $('hS').textContent=streak+(streak>=STREAK_AT?' 🔥':'');
  $('hS').classList.toggle('streak-hot',streak>=STREAK_AT);
  $('progFill').style.width=(i/order.length*100)+'%';
  const lvClass='lv'+q.lv, lvName=['','Level 1 · Aufwärmen','Level 2 · Anwenden','Level 3 · Fälle knacken'][q.lv];
  $('stage').innerHTML=`
    <span class="level-badge ${lvClass}">${lvName}</span>
    <div class="qtext pop">${q.q}</div>
    <div class="opts" id="opts">${q.o.map((o,idx)=>`<button onclick="pick(${idx},this)">${o}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
    <div class="actions">
      <button class="btn btn-joker" id="jBtn" ${joker?'':'disabled'} onclick="useJoker()">50:50 Joker (${joker})</button>
      <button class="btn btn-main" id="next" style="display:none" onclick="nextQ()">Weiter →</button>
    </div>`;
  tStart=Date.now();
}

function useJoker(){
  if(!joker||locked)return;
  joker=0;$('jBtn').disabled=true;$('jBtn').textContent='50:50 Joker (0)';
  const q=order[i],btns=[...document.querySelectorAll('#opts button')];
  const wrong=btns.map((b,idx)=>idx).filter(idx=>idx!=q.a);
  shuffle(wrong).slice(0,q.o.length-2).forEach(idx=>{btns[idx].classList.add('gone');btns[idx].disabled=true});
}

function pick(idx,btn){
  if(locked)return;locked=true;
  const q=order[i],btns=[...document.querySelectorAll('#opts button')];
  btns.forEach(b=>b.disabled=true);
  const ok=idx===q.a, fast=Date.now()-tStart<SPEED_MS;
  const fb=$('fb');
  if(ok){
    correctCount++;streak++;best=Math.max(best,streak);
    let gain=BASE*q.lv, tags='';
    if(streak>=STREAK_AT){gain*=2;tags+='<span class="bonus-tag">Streak ×2</span>'}
    if(fast){gain+=SPEED_PTS;tags+='<span class="bonus-tag">Tempo +5</span>'}
    pts+=gain;
    btn.classList.add('right');
    fb.className='fb show good';fb.innerHTML=`✔ Richtig! +${gain} ${tags}<br>${q.fb}`;
  }else{
    streak=0;
    btn.classList.add('wrong');btns[q.a].classList.add('right');
    fb.className='fb show bad';fb.innerHTML=`✘ Daneben. ${q.fb}`;
  }
  $('hP').textContent=pts;$('hS').textContent=streak;
  $('next').style.display='inline-block';
  $('next').textContent=(i===order.length-1)?'Auswertung →':'Weiter →';
}

function nextQ(){ i++; i<order.length?render():finish(); }

function finish(){
  $('progFill').style.width='100%';
  const maxPts=order.reduce((s,q)=>s+BASE*q.lv,0);
  const pct=Math.min(100,Math.round(pts/maxPts*100));
  const rank=[...RANKS].reverse().find(r=>pct>=r.min);
  $('stage').innerHTML=`
    <div class="center pop">
      <div class="rank">${rank.icon}</div>
      <div class="big">${rank.name}</div>
      <p class="subtitle">${rank.txt}</p>
      <div class="hud" style="justify-content:center">
        <div class="box"><div class="lbl">Punkte</div><div class="val">${pts}</div></div>
        <div class="box"><div class="lbl">Richtig</div><div class="val">${correctCount}/${order.length}</div></div>
        <div class="box"><div class="lbl">Beste Serie</div><div class="val">${best}</div></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn btn-main" onclick="start()">Nochmals spielen</button>
      </div>
    </div>`;
}
</script>
</body>
