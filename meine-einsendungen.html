<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meine Einsendungen · ABU Lernraum</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --t1: #4A5568; --t1-dark: #2D3748; --t1-light: #E2E8F0; --t1-lighter: #F7FAFC;
    --bg: #FBF8F4; --paper: #FFFFFF; --ink: #20221F; --ink-light: #7A7468; --rule: #ECE6DA;
    --green: #1F8045; --green-light: #E9F7EE; --err: #C0392B; --err-light: #FDECEA;
  }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; line-height: 1.6; }
  .top-bar { background: linear-gradient(120deg, #6B7684 0%, #4A5568 40%, #2D3748 100%); color: white; padding: 16px 22px; }
  .top-bar h1 { font-size: 18px; font-weight: 700; }
  .top-bar a { color: rgba(255,255,255,.85); font-size: 13px; text-decoration: none; }
  .top-bar a:hover { color: white; text-decoration: underline; }
  .ws { max-width: 640px; margin: 0 auto; padding: 34px 26px 60px; }
  .intro { font-size: 14.5px; color: var(--ink-light); margin-bottom: 22px; line-height: 1.65; }
  .card { background: var(--paper); border-radius: 14px; padding: 22px 24px; box-shadow: 0 2px 10px rgba(0,0,0,.05); margin-bottom: 20px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--t1-dark); margin: 14px 0 5px; }
  label:first-child { margin-top: 0; }
  input[type=text] { width: 100%; border: 1.5px solid var(--rule); border-radius: 9px; background: var(--bg); font-family: inherit; font-size: 14.5px; padding: 10px 12px; }
  input[type=text]:focus { outline: none; border-color: var(--t1); background: white; box-shadow: 0 0 0 3px var(--t1-light); }
  input#code { font-family: 'JetBrains Mono', monospace; letter-spacing: .05em; text-transform: uppercase; }
  .btn { margin-top: 18px; width: 100%; padding: 12px; border-radius: 999px; border: none; background: var(--t1-dark); color: white; font-weight: 700; font-size: 14.5px; cursor: pointer; font-family: inherit; }
  .btn:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .msg { margin-top: 14px; padding: 10px 14px; border-radius: 9px; font-size: 13.5px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: var(--err-light); color: var(--err); }
  .msg.info { background: var(--t1-lighter); color: var(--t1-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .result-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; flex-wrap: wrap; gap: 6px; }
  .result-title { font-size: 16px; font-weight: 800; color: var(--ink); }
  .result-badge { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--green-light); color: #135c2c; white-space: nowrap; }
  .result-meta { font-size: 12px; color: var(--ink-light); font-family: 'JetBrains Mono', monospace; margin-bottom: 16px; }
  .qa { background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .qa .q { font-size: 11.5px; font-weight: 700; color: var(--t1-dark); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 5px; }
  .qa .a { font-size: 14px; color: var(--ink); white-space: pre-wrap; }
  .qa .a.empty { color: var(--ink-light); font-style: italic; }
</style>
</head>
<body>
<div class="top-bar">
  <h1>📋 Meine Einsendungen</h1>
</div>
<div class="ws">
  <p class="intro">Hier kannst du eine bereits eingesendete Übung nochmals ansehen. Du brauchst dazu genau die Angaben, die beim Einsenden verwendet wurden, sowie den <strong>Beleg-Code</strong>, der dir direkt nach dem Absenden angezeigt wurde.</p>

  <div class="card">
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Vorname Nachname">
    <label for="klasse">Klasse</label>
    <input type="text" id="klasse" placeholder="z.B. LW3a">
    <label for="code">Beleg-Code</label>
    <input type="text" id="code" placeholder="XXXX-XXXX">
    <button class="btn" id="suchenBtn" onclick="sucheEinsendung()">Einsendung anzeigen</button>
    <div class="msg" id="msgBox"></div>
  </div>

  <div class="card result" id="resultCard">
    <div class="result-head">
      <div class="result-title" id="resTitel"></div>
      <div class="result-badge" id="resBadge"></div>
    </div>
    <div class="result-meta" id="resMeta"></div>
    <div id="resAntworten"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://lrpaomltzrfgtupzeooq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Q9t2s4kLLNy--Tkm8EwLBQ_CbHJo9G-';
let supabaseClient = null;
function getClient(){ if(!supabaseClient && window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); return supabaseClient; }

function normalisiereKlasse(roh){ let k=roh.trim().replace(/\s+/g,''); const m=k.match(/^(.*\d)([a-zA-Z])$/); return m?m[1].toUpperCase()+m[2].toLowerCase():k.toUpperCase(); }

function zeigeMsg(text, art){
  const box = document.getElementById('msgBox');
  box.textContent = text;
  box.className = 'msg show ' + (art||'info');
}
function verstecke(el){ el.classList.remove('show'); }

async function sucheEinsendung(){
  const name = document.getElementById('name').value.trim();
  const klasseRoh = document.getElementById('klasse').value.trim();
  const code = document.getElementById('code').value.trim().toUpperCase();
  const resultCard = document.getElementById('resultCard');
  verstecke(resultCard);
  verstecke(document.getElementById('msgBox'));

  if(!name){ zeigeMsg('Bitte Namen eingeben.', 'err'); return; }
  if(!klasseRoh){ zeigeMsg('Bitte Klasse eingeben.', 'err'); return; }
  if(!code){ zeigeMsg('Bitte Beleg-Code eingeben.', 'err'); return; }
  const klasse = normalisiereKlasse(klasseRoh);

  const client = getClient();
  if(!client){ zeigeMsg('Verbindung aktuell nicht möglich. Bitte später erneut versuchen.', 'err'); return; }

  const btn = document.getElementById('suchenBtn');
  const alt = btn.textContent; btn.disabled = true; btn.textContent = 'Suche…';

  try{
    const { data, error } = await client.rpc('get_submission_by_code', { p_code: code });
    if(error) throw error;
    if(!data || data.length === 0){ zeigeMsg('Kein Eintrag zu diesem Beleg-Code gefunden. Bitte Code prüfen.', 'err'); return; }
    const eintrag = data[0];
    if(eintrag.name.trim().toLowerCase() !== name.toLowerCase() || eintrag.klasse.toLowerCase() !== klasse.toLowerCase()){
      zeigeMsg('Name/Klasse passen nicht zu diesem Beleg-Code. Bitte Angaben prüfen.', 'err');
      return;
    }
    zeigeEintrag(eintrag);
  } catch(err){
    zeigeMsg('Suche fehlgeschlagen. (' + ((err&&err.message)?err.message:'unbekannt') + ')', 'err');
  } finally {
    btn.disabled = false; btn.textContent = alt;
  }
}

function zeigeEintrag(e){
  document.getElementById('resTitel').textContent = e.datei.replace(/_/g,' ');
  const a = e.auswertung || {};
  const geloest = (a.text_geloest||0) + (a.mc_richtig||0);
  const total = (a.text_total||0) + (a.mc_total||0);
  document.getElementById('resBadge').textContent = geloest + ' / ' + total + ' bearbeitet/richtig';
  document.getElementById('resMeta').textContent = e.name + ' · ' + e.klasse + ' · eingesendet am ' + new Date(e.created_at).toLocaleString('de-CH');

  const container = document.getElementById('resAntworten');
  container.innerHTML = '';
  const antworten = e.antworten || {};
  Object.keys(antworten).forEach(function(key){
    const val = antworten[key];
    if(typeof val === 'string' || typeof val === 'boolean'){
      const box = document.createElement('div'); box.className = 'qa';
      const q = document.createElement('div'); q.className = 'q'; q.textContent = key;
      const av = document.createElement('div');
      const text = (typeof val === 'boolean') ? (val ? 'Ja' : 'Nein') : val.trim();
      av.className = 'a' + (text ? '' : ' empty');
      av.textContent = text || '(nicht beantwortet)';
      box.appendChild(q); box.appendChild(av);
      container.appendChild(box);
    }
  });
  document.getElementById('resultCard').classList.add('show');
}
</script>
</body>
</html>
